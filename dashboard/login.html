<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot Bro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #141820;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #1a1f2e;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-bottom: 10px; font-size: 28px; }
        p { color: var(--text-dim); margin-bottom: 30px; font-size: 14px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; margin-bottom: 8px; color: var(--text-dim); }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #0b0e14;
            border: 1px solid #1a1f2e;
            border-radius: 12px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #0b0e14;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .footer-link { margin-top: 20px; font-size: 13px; color: var(--text-dim); }
        .footer-link a { color: var(--accent); text-decoration: none; }
        @media (max-width: 480px) {
            body { padding: 20px; overflow: auto; height: auto; min-height: 100vh; }
            .login-card { padding: 25px 20px; }
            h1 { font-size: 24px; }
            p { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: left; margin-bottom: 20px;">
            <a href="../index.html" style="color: var(--text-dim); text-decoration: none; font-size: 14px;">&larr; Back to Home</a>
        </div>
        <h1>Welcome Back</h1>
        <p>Login to manage your AI chatbots.</p>
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        <div class="footer-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = 'Authenticating...';
            
            const formData = new FormData();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch('http://localhost:8000/token', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid credentials');
                    btn.innerText = 'Login';
                }
            } catch (err) {
                alert('Backend Offline');
                btn.innerText = 'Login';
            }
        };
    </script>
</body>
</html>
